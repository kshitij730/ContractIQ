name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 4 * * 1'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python -m pip install --upgrade pip
      - run: pip install bandit pip-audit -r backend/requirements.txt
      - run: bandit -r backend/app backend/main.py -ll
      - run: pip-audit -r backend/requirements.txt
      - run: npm ci
      - run: npm audit --audit-level=high
